<app-header></app-header>
<app-base-layout class="admin">
    <div class="btn-toolbar menu">
        <div class="btn-group me-5">
            @for(menuEntry of menuEntries; track menuEntry) {
                <button [routerLink]="menuEntry.path" class="btn btn-primary">{{ menuEntry.title }}</button>
            }
        </div>
        <div class="btn-group">
            <button (click)="logout()" class="btn btn-secondary">Uitloggen</button>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <router-outlet class="card-text"></router-outlet>
        </div>
    </div>
</app-base-layout>
