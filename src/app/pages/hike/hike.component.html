<app-header></app-header>
<hike-banner></hike-banner>
@if (highlights$ | async; as highlightsResult) {
  @if (highlightsResult | loading) {
    <loading-animation></loading-animation>
  }
  @if (highlightsResult | valid) {
    <highlights-chain [highlights]="(highlightsResult | data)!" class="highlights-chain"></highlights-chain>
    <app-footer></app-footer>
  }
  @if (highlightsResult | error) {
    <h6 class="error-message"><i>Het laden is mislukt.</i></h6>
  }
}
